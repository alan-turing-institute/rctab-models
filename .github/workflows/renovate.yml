---

name: Renovate

on:
  schedule:
    # Run often so automerges, rebases and Dependency Dashboard ticks are
    # picked up promptly. When new update PRs may be opened is controlled by
    # "schedule" in renovate.json, not by this cron.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: "Renovate log level"
        type: choice
        options: ["info", "debug"]
        default: "info"
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

# Renovate uses its own token, not GITHUB_TOKEN, because PRs opened with
# GITHUB_TOKEN don't trigger CI and so could never be automerged.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
