[tool.poetry]
name = "rctab_models"
version = "0.4.0"
description = ""
authors = ["Iain-S <25081046+Iain-S@users.noreply.github.com >"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.11.5"


[tool.poetry.group.dev.dependencies]
# Exact pins: with no lock file, Renovate bumps these in PRs so that new
# linter releases can't break CI unannounced.
black = "26.10.1"
pylint = "4.1.4"
isort = "9.0.2"
mypy = "2.4.1"
pymarkdownlnt = "0.9.42"
pydocstyle = "6.3.0"
pytest = "9.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
